<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Your Universe</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><rect width='256' height='256' fill='none'/><circle cx='128' cy='128' r='84' fill='none' stroke='%23ff2e2e' stroke-miterlimit='10' stroke-width='24'/><ellipse cx='128' cy='128' rx='120' ry='40' transform='translate(-53.02 128) rotate(-45)' fill='none' stroke='%23ff2e2e' stroke-linecap='round' stroke-linejoin='round' stroke-width='24'/></svg>">

    <meta property="og:title" content="Your Universe">
    <meta property="og:description" content="Aceitar o fim é entender que até mesmo o universo um dia se colapsará.">
    <meta name="theme-color" content="#000000">

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=JetBrains+Mono:wght@300;400&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --red: #ff2e2e;
            --red-glow: rgba(255, 46, 46, 0.35);
            --font-display: 'Cinzel', serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: var(--font-mono);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =============================
           CANVAS — ESTRELAS DE FUNDO
           ============================= */
        #sky {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        /* =============================
           BORDA COLAPSANDO (EDGE GLOW)
           ============================= */
        .edge-collapse {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            border: 2px solid transparent;
            animation: edgeBreathe 6s ease-in-out infinite;
            box-shadow:
                inset 0 0 80px rgba(255, 46, 46, 0.03),
                inset 0 0 200px rgba(0, 0, 0, 0.6);
        }

        @keyframes edgeBreathe {

            0%,
            100% {
                box-shadow:
                    inset 0 0 80px rgba(255, 46, 46, 0.02),
                    inset 0 0 200px rgba(0, 0, 0, 0.6);
            }

            50% {
                box-shadow:
                    inset 0 0 120px rgba(255, 46, 46, 0.06),
                    inset 0 0 250px rgba(0, 0, 0, 0.7);
            }
        }

        /* =============================
           CONTEÚDO
           ============================= */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }

        /* — Datas — */
        .dates {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 60px;
            opacity: 0;
            animation: fadeUp 2.5s 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .date {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #aaa;
        }

        .date-line {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 46, 46, 0), rgba(255, 46, 46, 0.4), rgba(255, 46, 46, 0));
        }

        .duration {
            display: block;
            margin-top: 18px;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255, 46, 46, 0.5);
            text-align: center;
            opacity: 0;
            animation: fadeUp 2s 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* — Frase — */
        .phrase {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 3.8vw, 2.8rem);
            color: #fff;
            line-height: 1.9;
            letter-spacing: 1.5px;
            margin-bottom: 60px;
            opacity: 0;
            animation: phraseIn 3.5s 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .phrase .accent {
            color: var(--red);
            text-shadow: 0 0 30px var(--red-glow);
        }

        @keyframes phraseIn {
            0% {
                opacity: 0;
                transform: translateY(25px);
                filter: blur(6px);
            }

            50% {
                filter: blur(0);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* — Assinatura — */
        .tag {
            display: inline-flex;
            align-items: center;
            gap: 20px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 10px;
            text-transform: uppercase;
            color: var(--red);
            opacity: 0;
            animation: fadeUp 2.5s 5.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .tag-line {
            width: 35px;
            height: 1px;
            background: var(--red);
            opacity: 0.4;
        }

        /* — Footer — */
        .foot {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            font-family: var(--font-mono);
            font-size: 0.5rem;
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.08);
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 2s 7.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* =============================
           ANIMAÇÕES
           ============================= */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =============================
           RESPONSIVO
           ============================= */
        @media (max-width: 768px) {
            .phrase {
                font-size: 1.3rem;
                line-height: 2;
                padding: 0 5px;
            }

            .date {
                font-size: 0.75rem;
                letter-spacing: 3px;
            }

            .dates {
                gap: 12px;
                margin-bottom: 45px;
            }

            .date-line {
                width: 35px;
            }

            .duration {
                font-size: 0.6rem;
                letter-spacing: 4px;
            }

            .tag {
                font-size: 0.6rem;
                letter-spacing: 7px;
            }
        }

        @media (max-width: 420px) {
            .phrase {
                font-size: 1.1rem;
            }

            .date {
                font-size: 0.65rem;
            }

            .dates {
                gap: 8px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <canvas id="sky"></canvas>

    <div class="edge-collapse"></div>

    <div class="content">
        <div class="dates">
            <span class="date">26.01.2026</span>
            <span class="date-line"></span>
            <span class="date">26.04.2026</span>
        </div>
        <div class="duration" id="duration"></div>

        <div class="phrase">
            Aceitar o fim é entender que até mesmo<br>
            o <span class="accent">universo</span> um dia se colapsará.
        </div>

        <div class="tag">
            <span class="tag-line"></span>
            Big Crunch
            <span class="tag-line"></span>
        </div>
    </div>

    <div class="foot">the universe has collapsed</div>

    <script>
        /* ==============================
           DURAÇÃO
           ============================== */
        (() => {
            const s = new Date("2026-01-26T01:46:00");
            const e = new Date("2026-04-26T00:00:00");
            const days = Math.floor((e - s) / 86400000);
            const m = Math.floor(days / 30);
            const d = days % 30;
            const parts = [];
            if (m) parts.push(`${m} ${m === 1 ? 'mês' : 'meses'}`);
            if (d) parts.push(`${d} ${d === 1 ? 'dia' : 'dias'}`);
            document.getElementById('duration').textContent = parts.join(' · ');
        })();

        /* ==============================
           STAR FIELD — COLAPSO PROGRESSIVO
           ============================== */
        const cvs = document.getElementById('sky');
        const c = cvs.getContext('2d');
        let W, H, cx, cy;

        function resize() {
            W = cvs.width = innerWidth;
            H = cvs.height = innerHeight;
            cx = W / 2;
            cy = H / 2;
        }
        addEventListener('resize', resize);
        resize();

        /* === CONFIGURAÇÃO DO COLAPSO === */
        const COLLAPSE_START = 600;      // frame onde começa o colapso (~10s)
        const COLLAPSE_DURATION = 3600;   // duração total do colapso (~60s)
        const INITIAL_STARS = Math.min(200, Math.floor(W * H / 6000));
        const MAX_STARS = Math.min(1200, Math.floor(W * H / 1200));
        const INITIAL_SAFE_ZONE = 0.28;
        const FINAL_SAFE_ZONE = 0.02;
        let collapsed = false;
        let flashAlpha = 0;

        /* Elementos do DOM para colapsar */
        const contentEl = document.querySelector('.content');
        const footEl = document.querySelector('.foot');
        const edgeEl = document.querySelector('.edge-collapse');

        /* Progresso do colapso (0 a 1) */
        function getCollapseProgress(frame) {
            if (frame < COLLAPSE_START) return 0;
            return Math.min(1, (frame - COLLAPSE_START) / COLLAPSE_DURATION);
        }

        /* Easing — acelera no final */
        function easeInCubic(t) { return t * t * t; }
        function easeInQuad(t) { return t * t; }

        /* Estrela */
        class Star {
            constructor(init) { this.spawn(init); }

            spawn(scatter) {
                const maxR = Math.hypot(cx, cy);
                const minR = maxR * INITIAL_SAFE_ZONE;
                if (scatter) {
                    const r = minR + Math.random() * (maxR * 1.2 - minR);
                    const a = Math.random() * Math.PI * 2;
                    this.x = cx + Math.cos(a) * r;
                    this.y = cy + Math.sin(a) * r;
                } else {
                    const side = Math.random() * 4 | 0;
                    if (side === 0) { this.x = Math.random() * W; this.y = -10; }
                    else if (side === 1) { this.x = W + 10; this.y = Math.random() * H; }
                    else if (side === 2) { this.x = Math.random() * W; this.y = H + 10; }
                    else { this.x = -10; this.y = Math.random() * H; }
                }
                this.r = 0.4 + Math.random() * 1.2;
                this.alpha = 0.15 + Math.random() * 0.6;
                this.baseAlpha = this.alpha;
                this.speed = 0.08 + Math.random() * 0.2;
                this.drift = (Math.random() - 0.5) * 0.3;
                this.red = Math.random() < 0.08;
                this.twinklePhase = Math.random() * Math.PI * 2;
                this.twinkleSpeed = 0.005 + Math.random() * 0.015;
                this.absorbed = false;
            }

            update(progress) {
                if (this.absorbed) return;
                const dx = cx - this.x;
                const dy = cy - this.y;
                const dist = Math.hypot(dx, dy);
                const maxR = Math.hypot(cx, cy);
                const safeZone = INITIAL_SAFE_ZONE - (INITIAL_SAFE_ZONE - FINAL_SAFE_ZONE) * easeInCubic(progress);
                const minR = maxR * safeZone;

                const angle = Math.atan2(dy, dx);
                // Gravidade aumenta progressivamente
                const gravityMult = 1 + progress * 8;
                const pull = this.speed * gravityMult * (1 + (1 - dist / maxR) * 2);

                const driftMult = Math.max(0, 1 - progress * 1.5);
                this.x += Math.cos(angle) * pull + Math.cos(angle + 1.5708) * this.drift * driftMult;
                this.y += Math.sin(angle) * pull + Math.sin(angle + 1.5708) * this.drift * driftMult;

                // Twinkle mais intenso no colapso
                this.twinklePhase += this.twinkleSpeed * (1 + progress * 3);
                this.alpha = this.baseAlpha * (0.6 + 0.4 * Math.sin(this.twinklePhase));

                // Mais estrelas ficam vermelhas durante o colapso
                if (!this.red && progress > 0.3 && Math.random() < 0.0005 * progress) {
                    this.red = true;
                }

                // Fade perto da zona segura
                if (dist < minR * 1.5) {
                    const fade = Math.max(0, (dist - minR) / (minR * 0.5));
                    this.alpha *= fade;
                }

                // Absorvida pelo centro
                if (dist < minR || (dist < 5 && progress > 0.8)) {
                    if (progress > 0.9) {
                        this.absorbed = true;
                        this.alpha = 0;
                    } else {
                        this.spawn(false);
                    }
                }
            }

            draw() {
                if (this.absorbed || this.alpha < 0.02) return;
                c.beginPath();
                c.arc(this.x, this.y, this.r, 0, 6.2832);
                if (this.red) {
                    c.fillStyle = `rgba(255,60,60,${this.alpha})`;
                } else {
                    c.fillStyle = `rgba(255,255,255,${this.alpha})`;
                }
                c.fill();
            }
        }

        /* Shooting star */
        class ShootingStar {
            constructor() { this.active = false; }
            trigger() {
                const edge = Math.random() * 4 | 0;
                if (edge === 0) { this.x = Math.random() * W; this.y = 0; }
                else if (edge === 1) { this.x = W; this.y = Math.random() * H; }
                else if (edge === 2) { this.x = Math.random() * W; this.y = H; }
                else { this.x = 0; this.y = Math.random() * H; }
                const a = Math.atan2(cy - this.y, cx - this.x);
                const offset = (Math.random() - 0.5) * 0.8;
                this.vx = Math.cos(a + offset) * (4 + Math.random() * 4);
                this.vy = Math.sin(a + offset) * (4 + Math.random() * 4);
                this.life = 1;
                this.decay = 0.008 + Math.random() * 0.012;
                this.trail = [];
                this.active = true;
            }
            update(progress) {
                if (!this.active) return;
                this.trail.push({ x: this.x, y: this.y, a: this.life });
                if (this.trail.length > 25) this.trail.shift();
                // Shooting stars são puxadas mais forte durante colapso
                const grav = progress * 2;
                const dx = cx - this.x, dy = cy - this.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 1) {
                    this.vx += (dx / dist) * grav;
                    this.vy += (dy / dist) * grav;
                }
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                const maxR = Math.hypot(cx, cy);
                if (dist < maxR * 0.05) this.life -= 0.05;
                if (this.life <= 0) this.active = false;
            }
            draw() {
                if (!this.active) return;
                for (let i = 1; i < this.trail.length; i++) {
                    const t0 = this.trail[i - 1], t1 = this.trail[i];
                    const progress = i / this.trail.length;
                    c.beginPath();
                    c.moveTo(t0.x, t0.y);
                    c.lineTo(t1.x, t1.y);
                    c.strokeStyle = `rgba(255,255,255,${progress * t1.a * 0.4})`;
                    c.lineWidth = progress * 1.5;
                    c.stroke();
                }
            }
        }

        /* Inicializar */
        const stars = [];
        for (let i = 0; i < INITIAL_STARS; i++) stars.push(new Star(true));

        const shooters = [];
        for (let i = 0; i < 3; i++) shooters.push(new ShootingStar());

        let lastShot = 0;
        let lastSpawn = 0;
        let t = 0;

        /* Render */
        function frame() {
            if (collapsed && flashAlpha <= 0.005) return; // parou
            t++;
            const progress = getCollapseProgress(t);
            const eased = easeInQuad(progress);

            c.fillStyle = '#000';
            c.fillRect(0, 0, W, H);

            /* --- Adicionar partículas progressivamente --- */
            if (!collapsed && stars.length < MAX_STARS && t - lastSpawn > Math.max(1, 15 - progress * 14)) {
                const batch = Math.ceil(1 + progress * 4);
                for (let i = 0; i < batch && stars.length < MAX_STARS; i++) {
                    stars.push(new Star(false));
                }
                lastSpawn = t;
            }

            /* --- Atualizar e desenhar estrelas --- */
            let activeStars = 0;
            for (const s of stars) {
                s.update(progress);
                s.draw();
                if (!s.absorbed) activeStars++;
            }

            /* --- Shooting stars (mais frequentes no colapso) --- */
            const shotInterval = Math.max(30, 240 - progress * 210);
            if (t - lastShot > shotInterval + Math.random() * shotInterval) {
                const free = shooters.find(s => !s.active);
                if (free) { free.trigger(); lastShot = t; }
            }
            for (const s of shooters) { s.update(progress); s.draw(); }

            /* --- Glow central (cresce com colapso) --- */
            const glowSize = 50 + eased * 250;
            const glowIntensity = 0.03 + eased * 0.25;
            const pulse = glowIntensity + Math.sin(t * 0.01) * 0.015;
            const grd = c.createRadialGradient(cx, cy, 0, cx, cy, glowSize);
            grd.addColorStop(0, `rgba(255,46,46,${Math.min(pulse, 0.8)})`);
            grd.addColorStop(0.4, `rgba(255,46,46,${Math.min(pulse * 0.3, 0.3)})`);
            grd.addColorStop(1, 'transparent');
            c.fillStyle = grd;
            c.beginPath();
            c.arc(cx, cy, glowSize, 0, 6.2832);
            c.fill();

            /* --- Colapsar conteúdo HTML --- */
            if (progress > 0.1) {
                const contentProgress = Math.min(1, (progress - 0.1) / 0.6);
                const ep = easeInCubic(contentProgress);
                const scale = 1 - ep * 0.95;
                const opacity = 1 - ep;
                contentEl.style.transform = `scale(${Math.max(0.05, scale)})`;
                contentEl.style.opacity = Math.max(0, opacity);
                contentEl.style.filter = `blur(${ep * 8}px)`;
                footEl.style.transform = `scale(${Math.max(0.05, scale)}) translateY(${ep * -200}px)`;
                footEl.style.opacity = Math.max(0, opacity);
            }

            /* --- Borda colapsa --- */
            if (progress > 0.2) {
                const edgeP = Math.min(1, (progress - 0.2) / 0.5);
                const inset = easeInQuad(edgeP) * Math.min(W, H) * 0.45;
                edgeEl.style.inset = `${inset}px`;
                edgeEl.style.borderRadius = `${easeInQuad(edgeP) * 50}%`;
                edgeEl.style.borderColor = `rgba(255,46,46,${edgeP * 0.3})`;
                edgeEl.style.boxShadow = `inset 0 0 ${80 + edgeP * 200}px rgba(255,46,46,${0.02 + edgeP * 0.15})`;
            }

            /* --- Flash final de implosão --- */
            if (progress >= 1 && !collapsed) {
                collapsed = true;
                flashAlpha = 1;
                contentEl.style.display = 'none';
                footEl.style.display = 'none';
                edgeEl.style.display = 'none';
            }

            if (collapsed) {
                // Flash branco/vermelho que desaparece
                flashAlpha *= 0.97;
                c.fillStyle = `rgba(255,46,46,${flashAlpha * 0.4})`;
                c.fillRect(0, 0, W, H);
                c.fillStyle = `rgba(255,255,255,${flashAlpha * 0.6})`;
                c.beginPath();
                c.arc(cx, cy, flashAlpha * 300, 0, 6.2832);
                c.fill();

                // Singularidade final
                if (flashAlpha < 0.3) {
                    const singGrd = c.createRadialGradient(cx, cy, 0, cx, cy, 8);
                    singGrd.addColorStop(0, `rgba(255,46,46,${0.6 - flashAlpha})`);
                    singGrd.addColorStop(1, 'transparent');
                    c.fillStyle = singGrd;
                    c.beginPath();
                    c.arc(cx, cy, 8, 0, 6.2832);
                    c.fill();
                }
            }

            requestAnimationFrame(frame);
        }

        frame();
    </script>
</body>

</html>
