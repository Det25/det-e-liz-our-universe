<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Det & Liz | Nosso Mundo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILO DARK RED --- */
        :root {
            --bg: #050505; 
            --panel: rgba(15, 15, 15, 0.95);
            --red: #8a1c1c; 
            --red-glow: rgba(138, 28, 28, 0.5);
            --text: #e0e0e0; 
            --dim: #888;
            --font-display: 'Cinzel', serif; 
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: var(--font-mono); height: 100vh; overflow: hidden; }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--red); }

        /* --- UI LAYOUT --- */
        #main-ui { display: grid; grid-template-columns: 80px 1fr; height: 100vh; opacity: 0; transition: opacity 1.5s ease-in-out; }
        
        /* HUD Lateral */
        .hud { border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; align-items: center; padding-top: 40px; background: rgba(5,5,5,0.9); z-index: 10; }
        .nav-item { margin-bottom: 40px; color: var(--dim); transition: 0.3s; font-size: 1.5rem; position: relative; cursor: pointer; }
        .nav-item:hover, .nav-item.active { color: var(--red); text-shadow: 0 0 15px var(--red-glow); transform: scale(1.1); }
        .nav-item .tooltip { position: absolute; left: 50px; background: var(--bg); border: 1px solid var(--red); padding: 5px 10px; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0; transition: 0.3s; pointer-events: none; white-space: nowrap; z-index: 20; }
        .nav-item:hover .tooltip { opacity: 1; left: 60px; }

        /* Palco Principal */
        .stage { padding: 50px 80px; overflow-y: auto; position: relative; background: radial-gradient(circle at top right, rgba(138,28,28,0.08), transparent 50%); }
        
        /* HEADER REFORMULADO */
        .header-meta { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 60px; border-bottom: 1px solid rgba(138, 28, 28, 0.3); padding-bottom: 15px; }
        .sys-info { font-size: 0.8rem; color: var(--dim); line-height: 1.6; letter-spacing: 1px; }
        .sys-info span { color: var(--text); font-weight: bold; text-transform: uppercase; }
        .sys-info .highlight { color: var(--red); }
        
        .timer-box { text-align: right; }
        .timer-label { font-size: 0.6rem; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 5px; }
        .timer-val { font-family: var(--font-display); font-size: 2rem; color: var(--text); text-shadow: 0 0 10px rgba(255,255,255,0.1); }

        /* ANIMAÇÕES */
        .content-gate { animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* ELEMENTOS VISUAIS */
        h2 { font-family: var(--font-display); font-size: 2.5rem; margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; color: #fff; }
        .subtitle { color: var(--red); font-size: 0.9rem; margin-bottom: 40px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.9; }

        /* CARD DE MÚSICA */
        .music-terminal { border: 1px solid rgba(138,28,28,0.3); background: rgba(0,0,0,0.4); padding: 40px; text-align: center; position: relative; border-radius: 4px; }
        .lyric-text { font-family: var(--font-display); font-size: 1.5rem; font-style: italic; min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1s; color: #fff; text-shadow: 0 0 10px rgba(138,28,28,0.3); }
        
        /* ESTILO NOVO PARA O CANTOR */
        .song-info {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--red);
            margin-top: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.9;
            font-style: normal; /* Remove itálico do nome */
        }

        .spotify-btn { margin-top: 30px; display: inline-block; font-size: 0.75rem; letter-spacing: 2px; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--red); padding-bottom: 5px; transition: 0.3s; text-transform: uppercase; }
        .spotify-btn:hover { color: var(--red); border-bottom-color: transparent; text-shadow: 0 0 10px var(--red); }

        /* TIMELINE */
        .timeline { border-left: 1px solid rgba(255,255,255,0.1); margin-left: 10px; padding-left: 40px; }
        .event { position: relative; margin-bottom: 50px; }
        .event::after { content: ''; position: absolute; left: -44px; top: 6px; width: 7px; height: 7px; background: var(--bg); border: 1px solid var(--red); border-radius: 50%; transition: 0.3s; }
        .event:hover::after { background: var(--red); box-shadow: 0 0 10px var(--red); }
        .event-date { font-size: 0.7rem; color: var(--red); letter-spacing: 2px; margin-bottom: 5px; font-weight: bold; }
        .event-title { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 8px; color: #fff; }
        .event-desc { font-size: 0.9rem; color: #999; max-width: 500px; line-height: 1.6; }

        /* HUB / MURAL */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
        
        .hub-card { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.05); 
            padding: 20px; 
            transition: 0.4s; 
            display: flex; 
            flex-direction: column; 
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .hud-footer {
        margin-top: auto;        /* Empurra o texto para o fundo */
        margin-bottom: 20px;     /* Afasta um pouco da borda de baixo */
        writing-mode: vertical-rl; 
        transform: rotate(180deg);
        color: var(--dim);
        font-size: 0.6rem;
        letter-spacing: 2px;
        opacity: 0.5;
        }
        

        .hub-card:hover { border-color: var(--red); transform: translateY(-5px); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.6); }

        .note-title { font-size: 0.7rem; color: var(--red); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; font-weight: bold; }
        .note-content { font-size: 0.95rem; line-height: 1.6; color: #ddd; font-family: var(--font-display); }

        .photo-frame { width: 100%; height: 200px; overflow: hidden; margin-bottom: 15px; border-radius: 2px; }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; opacity: 0.8; }
        .hub-card:hover .photo-frame img { transform: scale(1.05); opacity: 1; }
        .photo-caption { font-size: 0.8rem; color: #aaa; font-style: italic; text-align: center; }

        /* INTRO SCREEN */
        #intro { position: fixed; inset: 0; background: #020202; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .intro-title { font-family: var(--font-display); font-size: 4rem; letter-spacing: 10px; color: #fff; margin-bottom: 30px; text-shadow: 0 0 30px var(--red-glow); animation: breathe 4s infinite ease-in-out; }
        .access-btn { background: transparent; border: 1px solid var(--dim); color: var(--dim); padding: 15px 50px; font-family: var(--font-mono); letter-spacing: 6px; font-size: 0.8rem; transition: 0.5s; cursor: pointer; text-transform: uppercase; }
        .access-btn:hover { border-color: var(--red); color: var(--red); box-shadow: 0 0 30px rgba(138,28,28,0.2); }
        
        

        @keyframes breathe { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; text-shadow: 0 0 40px var(--red); } }

    </style>
</head>

        function loadTab(key, el) {
            // Limpa intervalo anterior se houver
            if (lyricsInterval) clearInterval(lyricsInterval);
            
            // Carrega conteúdo
            document.getElementById('dynamic-area').innerHTML = db[key];
            
            // Atualiza menu
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(el) el.classList.add('active');
            else document.querySelector('.nav-item').classList.add('active');

            // Se for a aba Dash, inicia animação da música
            if (key === 'dash') startLyricsAnimation();
        }

        function startLyricsAnimation() {
            let index = 0;
            const el = document.getElementById('lyrics-display');
            if(!el) return;

            // Função interna para montar o HTML (Verso + Cantor)
            const renderMusic = (idx) => {
                const item = musicPlaylist[idx];
                el.innerHTML = `
                    "${item.verse}"
                    <span class="song-info">♫ ${item.song}</span>
                `;
            };

            // Primeira execução imediata
            renderMusic(0);

            // Intervalo de troca
            lyricsInterval = setInterval(() => {
                el.style.opacity = 0; // Fade Out
                setTimeout(() => {
                    index = (index + 1) % musicPlaylist.length;
                    renderMusic(index); // Troca texto
                    el.style.opacity = 1; // Fade In
                }, 1000); // 1s de transição
            }, 6000); // 6s para ler
        }

        function updateClock() {
            const now = new Date();
            const diff = now - startDate;
            const d = Math.floor(diff / (1000*60*60*24));
            const h = Math.floor((diff/(1000*60*60))%24);
            const m = Math.floor((diff/(1000*60))%60);
            const s = Math.floor((diff/1000)%60);
            document.getElementById('clock').innerText = `${d}d ${h}h ${m}m`;
        }
        setInterval(updateClock, 1000);
        updateClock();

    </script>
