<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Det & Sky | Our Universe</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">

    <meta property="og:title" content="Det & Sky | Our Universe">
    <meta property="og:description" content="De todas as estrelas, você foi a que mais brilhou.">
    <meta name="theme-color" content="#8a1c1c">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505; 
            --red: #ff2e2e; /* O novo vermelho mais vivo */
            --red-glow: rgba(255, 46, 46, 0.4); /* Glow acompanhando a cor */
            --text: #e0e0e0; 
            --dim: #888;
            --font-display: 'Cinzel', serif; 
            --font-mono: 'JetBrains Mono', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: var(--font-mono); height: 100vh; overflow: hidden; }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--red); }

        /* --- LAYOUT GRID --- */
        #main-ui { 
            display: grid; 
            grid-template-columns: 80px 1fr; /* Mantém sempre Coluna 1: Menu (80px), Coluna 2: Conteúdo */
            height: 100vh; 
            opacity: 0; 
            transition: opacity 1.5s ease-in-out; 
        }
        
        /* --- HUD (MENU LATERAL) --- */
        .hud { 
            grid-column: 1; 
            border-right: 1px solid rgba(255,255,255,0.05); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 40px; 
            background: rgba(5,5,5,0.95); 
            z-index: 10; 
        }

        .nav-item { margin-bottom: 40px; color: var(--dim); transition: 0.3s; font-size: 1.5rem; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 50px; height: 50px; }
        .nav-item:hover, .nav-item.active { color: var(--red); text-shadow: 0 0 15px var(--red-glow); transform: scale(1.1); }
        
        .nav-item .tooltip { position: absolute; left: 60px; background: var(--bg); border: 1px solid var(--red); padding: 5px 10px; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0; transition: 0.3s; pointer-events: none; white-space: nowrap; z-index: 20; }
        .nav-item:hover .tooltip { opacity: 1; left: 70px; }

        .hud-footer { margin-top: auto; margin-bottom: 20px; writing-mode: vertical-rl; transform: rotate(180deg); color: var(--dim); font-size: 0.6rem; letter-spacing: 2px; opacity: 0.5; }

        /* --- PALCO PRINCIPAL --- */
        .stage { 
            grid-column: 2; 
            padding: 50px 80px; 
            overflow-y: auto; 
            position: relative; 
            background: radial-gradient(circle at top right, rgba(138,28,28,0.08), transparent 50%); 
        }
        
        /* HEADER */
        .header-meta { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 60px; border-bottom: 1px solid rgba(138, 28, 28, 0.3); padding-bottom: 15px; }
        .sys-info { font-size: 0.8rem; color: var(--dim); line-height: 1.6; letter-spacing: 1px; }
        .sys-info span { color: var(--text); font-weight: bold; text-transform: uppercase; }
        .sys-info .highlight { color: var(--red); }
        
        .timer-box { text-align: right; }
        .timer-label { font-size: 0.6rem; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 5px; }
        .timer-val { font-family: var(--font-display); font-size: 2rem; color: var(--text); text-shadow: 0 0 10px rgba(255,255,255,0.1); }

        /* ELEMENTOS GERAIS */
        h2 { font-family: var(--font-display); font-size: 2.5rem; margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; color: #fff; }
        .subtitle { color: var(--red); font-size: 0.9rem; margin-bottom: 40px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.9; }
        .content-gate { animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; transform: translateY(20px); width: 100%; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* MÚSICA */
        .music-terminal { border: 1px solid rgba(138,28,28,0.3); background: rgba(0,0,0,0.4); padding: 40px; text-align: center; border-radius: 4px; }
        .lyric-text { font-family: var(--font-display); font-size: 1.5rem; font-style: italic; min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1s; color: #fff; text-shadow: 0 0 10px rgba(138,28,28,0.3); }
        .song-info { display: block; font-family: var(--font-mono); font-size: 0.75rem; color: var(--red); margin-top: 15px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.9; font-style: normal; }
        .spotify-btn { margin-top: 30px; display: inline-block; font-size: 0.75rem; letter-spacing: 2px; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--red); padding-bottom: 5px; transition: 0.3s; text-transform: uppercase; }
        .spotify-btn:hover { color: var(--red); border-bottom-color: transparent; text-shadow: 0 0 10px var(--red); }

        /* TIMELINE */
        .timeline { border-left: 1px solid rgba(255,255,255,0.1); margin-left: 10px; padding-left: 40px; }
        .event { position: relative; margin-bottom: 50px; }
        .event::after { content: ''; position: absolute; left: -44px; top: 6px; width: 7px; height: 7px; background: var(--bg); border: 1px solid var(--red); border-radius: 50%; transition: 0.3s; }
        .event:hover::after { background: var(--red); box-shadow: 0 0 10px var(--red); }
        .event-date { font-size: 0.7rem; color: var(--red); letter-spacing: 2px; margin-bottom: 5px; font-weight: bold; }
        .event-title { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 8px; color: #fff; }
        .event-desc { font-size: 0.9rem; color: #999; max-width: 500px; line-height: 1.6; }

        /* MURAL */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
        .hub-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 20px; transition: 0.4s; display: flex; flex-direction: column; border-radius: 4px; overflow: hidden; }
        .hub-card:hover { border-color: var(--red); transform: translateY(-5px); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.6); }
        .note-title { font-size: 0.7rem; color: var(--red); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; font-weight: bold; }
        .note-content { font-size: 0.95rem; line-height: 1.6; color: #ddd; font-family: var(--font-display); }
        .photo-frame { width: 100%; height: 200px; overflow: hidden; margin-bottom: 15px; border-radius: 2px; }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; opacity: 0.8; }
        .hub-card:hover .photo-frame img { transform: scale(1.05); opacity: 1; }
        .photo-caption { font-size: 0.8rem; color: #aaa; font-style: italic; text-align: center; }

        /* INTRO */
        #intro { position: fixed; inset: 0; background: #020202; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .intro-title { font-family: var(--font-display); font-size: 4rem; letter-spacing: 10px; color: #fff; margin-bottom: 30px; text-shadow: 0 0 30px var(--red-glow); animation: breathe 4s infinite ease-in-out; }
        .access-btn { background: transparent; border: 1px solid var(--dim); color: var(--dim); padding: 15px 50px; font-family: var(--font-mono); letter-spacing: 6px; font-size: 0.8rem; transition: 0.5s; cursor: pointer; text-transform: uppercase; }
        .access-btn:hover { border-color: var(--red); color: var(--red); box-shadow: 0 0 30px rgba(138,28,28,0.2); }
        @keyframes breathe { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; text-shadow: 0 0 40px var(--red); } }

        /* === RESPONSIVIDADE (AJUSTADA PARA MANTER HUD LATERAL) === */
        @media (max-width: 1024px) {
            /* Removi o código que transformava em Flex Column. Agora o grid permanece. */
            
            .stage {
                padding: 30px 20px; /* Reduzi apenas o padding para caber melhor */
            }

            /* Ajustes apenas de tamanho de fonte, sem mudar a posição do menu */
            .header-meta { flex-direction: column; align-items: flex-start; gap: 15px; }
            .timer-box { text-align: left; }
            .timer-val { font-size: 1.4rem; }
            h2 { font-size: 1.6rem; }
            .intro-title { font-size: 2.5rem; letter-spacing: 5px; }
            
            /* Ocultar tooltip no celular pois não tem mouse hover */
            .nav-item .tooltip { display: none; }
        }
    </style>
</head>
<body>

    <div id="intro">
        <div class="intro-title">Det & Sky</div>
        <button class="access-btn" onclick="unlock()">Entrar</button>
    </div>

    <div id="main-ui">
        <aside class="hud">
            <div class="nav-item active" onclick="loadTab('dash', this)">
                <span>◈</span><div class="tooltip">Início</div>
            </div>
            <div class="nav-item" onclick="loadTab('time', this)">
                <span>∞</span><div class="tooltip">Linha do Tempo</div>
            </div>
            <div class="nav-item" onclick="loadTab('notes', this)">
                <span>♥</span><div class="tooltip">Mural</div>
            </div>

            <div class="hud-footer">designed by Dπt • 2026</div>
        </aside>

        <main class="stage">
            <header class="header-meta">
                <div class="sys-info">
                    NOSSO UNIVERSO<br>
                    <span class="highlight">Det & Sky</span><br>
                    Status: <span>Conectados</span>
                </div>
                <div class="timer-box">
                    <div class="timer-label">Tempo Juntos</div>
                    <div class="timer-val" id="clock">00d 00h 00m</div>
                </div>
            </header>

            <div id="dynamic-area">
                </div>
        </main>
    </div>

    <script>
        const startDate = new Date(2026, 0, 21); // 21 de janeiro de 2026
        
        const musicPlaylist = [
            { verse: "Eu disfarço, nego, minto… mas o coração sempre entrega o que sente.", song: "Chitãozinho & Xororó — Evidências" },
            { verse: "O que você fez em menos de um mês nenhuma outra fez.", song: "Matheus & Kauan — Te Assumi Pro Brasil" },
            { verse: "E nessa loucura de dizer que não te quero, vou negando as aparências...", song: "Evidências" },
            { verse: "É por você que canto, é por você que eu vivo... O universo conspira a nosso favor.", song: "Leandro & Leonardo" },
            { verse: "Eu quero ser pra você o que ninguém nunca foi. Quero seu amor agora e o resto depois.", song: "Cristiano Araújo" },
            { verse: "Eu troco meu destino só pra viver o seu, porque meu lugar é onde você estiver.", song: "Luan Santana" },
            { verse: "Você me mostrou o amor… e eu te mostrei ao mundo.", song: "Henrique & Juliano" },    
            { verse: "Se for pra errar, que seja tentando te amar.", song: "Jorge & Mateus" },
            { verse: "Entre tantas pessoas, foi você quem meu coração escolheu.", song: "Victor & Leo" },
            { verse: "Tem sentimentos que a gente tenta calar, mas o coração insiste em lembrar.", song: "Zezé Di Camargo" },
            { verse: "Tem história que começa simples e vira eternidade.", song: "Matheus & Kauan" },
            { verse: "Eu tentei te esquecer, mas foi você que nunca saiu de mim.", song: "Matogrosso & Mathias" },
            { verse: "O amor é isso: quando a gente percebe, já é tarde pra fugir.", song: "Henrique & Juliano" },
            { verse: "Se amar fosse fácil, não seria tão intenso.", song: "Marília Mendonça" },
            { verse: "Você chegou e bagunçou tudo, mas do jeito que eu sempre quis.", song: "Gusttavo Lima" },
            { verse: "Se for pra ser, que seja com você.", song: "Jorge & Mateus" },
            { verse: "Mesmo negando, o coração sempre entrega a verdade.", song: "Evidências" },
            { verse: "Entre tantas histórias, eu escolhi viver a nossa.", song: "O Nosso Santo Bateu" },
            { verse: "Você virou parte da minha história sem pedir permissão.", song: "Evidências" },
            { verse: "Entre todas as escolhas da vida, você foi a melhor.", song: "Os Anjos Cantam" },
            { verse: "Daria a minha vida por um beijo seu, daria o meu mundo pra te ter aqui.", song: "Zezé Di Camargo" },
            { verse: "Enquanto houver razões eu não desisto de você.", song: "Jorge & Mateus" },
        ];

        function unlock() {
            const intro = document.getElementById('intro');
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                document.getElementById('main-ui').style.opacity = '1';
                loadTab('dash');
            }, 800);
        }

        let lyricsInterval;

        const db = {
            dash: `
                <div class="content-gate">
                    <h2>Bem-vindo(a),</h2>
                    <div class="subtitle">Simplesmente nós dois.</div>
                    
                    <div class="music-terminal">
                        <div style="font-size:0.7rem; color:var(--red); letter-spacing:3px; margin-bottom:20px; text-transform:uppercase;">Tocando no Coração</div>
                        <div id="lyrics-display" class="lyric-text">"Carregando..."</div>
                        
                        <a href="https://open.spotify.com/playlist/37i9dQZF1DXcBWIGoYBM5M" target="_blank" class="spotify-btn">
                            Abrir Nossa Playlist
                        </a>
                    </div>

                    <div style="margin-top: 60px; text-align:center;">
                        <div style="font-size:3rem; color:var(--red); margin-bottom:20px;">❝</div>
                        <div style="font-family: var(--font-display); font-size: 1.1rem; color: #ccc; line-height: 1.8; max-width: 600px; margin: 0 auto;">
                            quem náO sabe o que quer,
                            acaba perdendo 0 que
                            tem, e as vezes descobre
                            que perdeu exatamente
                            o que queria.
                        </div>
                    </div>
                </div>
            `,
            time: `
                <div class="content-gate">
                    <h2>Linha do Tempo</h2>
                    <div class="subtitle">Momentos que marcaram a gente</div>
                    
                    <div class="timeline">
                        <div class="event">
                            <div class="event-date">21.01.2026</div>
                            <div class="event-title">O Começo de Tudo</div>
                            <div class="event-desc">O dia que mudou nossas vidas. Quando decidimos que caminharíamos juntos.</div>
                        </div>
                        <div class="event">
                            <div class="event-date">22.01.2026</div>
                            <div class="event-title">Primeira partida de Free Fire</div>
                            <div class="event-desc">Lembra daquele x1? insano demais.</div>
                        </div>
                        <div class="event">
                            <div class="event-date">HOJE</div>
                            <div class="event-title">Cada Dia Mais</div>
                            <div class="event-desc">Construindo nossa história, um dia de cada vez.</div>
                        </div>
                    </div>
                </div>
            `,
            notes: `
                <div class="content-gate">
                    <h2>Mural de Memórias</h2>
                    <div class="subtitle">Nossos Momentos.</div>
                    
                    <div class="gallery-grid">
                        <div class="hub-card">
                            <div class="note-title">Sobre sua picareta</div>
                            <div class="note-content">
                                "O jeito que vc me mostra essa picaretona me encanta rs"
                            </div>
                        </div>
                        <div class="hub-card">
                            <div class="photo-frame">
                                <img src="https://preview.redd.it/origin-of-this-image-v0-mezrnhfpgz4c1.jpg?width=649&format=pjpg&auto=webp&s=0897126562b960b1adb3fd424f1116034c35cf21" alt="Nós">
                            </div>
                            <div class="photo-caption">Nosso futuro fiote.</div>
                        </div>
                        <div class="hub-card">
                            <div class="note-title">Nerdice</div>
                            <div class="note-content">
                                "toma vergonha, ninguém te ama, but..."
                            </div>
                        </div>
                        <div class="hub-card">
                            <div class="photo-frame">
                                <img src="https://wallpapers.com/images/hd/cute-anime-couple-matching-pfp-profile-picture-30-2p7d6n7s2j8k9l0m.jpg" alt="Viagem">
                            </div>
                            <div class="photo-caption">Nerdola.</div>
                        </div>
                        <div class="hub-card">
                            <div class="note-title">Lembrete Diário</div>
                            <div class="note-content">
                                "Não esquece o gfzão de lei"
                            </div>
                        </div>
                        <div class="hub-card">
                            <div class="note-title">Meta Anual</div>
                            <div class="note-content">
                                "x1 no free fire valendo robux"
                            </div>
                        </div>
                    </div>
                </div>
            `
        };

        function loadTab(key, el) {
            if (lyricsInterval) clearInterval(lyricsInterval);
            document.getElementById('dynamic-area').innerHTML = db[key];
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(el) {
                el.classList.add('active');
            } else {
                if(key === 'dash') document.querySelectorAll('.nav-item')[0].classList.add('active');
            }
            if (key === 'dash') startLyricsAnimation();
        }

        function startLyricsAnimation() {
            let index = 0;
            const el = document.getElementById('lyrics-display');
            if(!el) return;
            const renderMusic = (idx) => {
                const item = musicPlaylist[idx];
                el.innerHTML = `"${item.verse}"<span class="song-info">♫ ${item.song}</span>`;
            };
            renderMusic(0);
            lyricsInterval = setInterval(() => {
                el.style.opacity = 0; 
                setTimeout(() => {
                    index = (index + 1) % musicPlaylist.length;
                    renderMusic(index); 
                    el.style.opacity = 1; 
                }, 1000); 
            }, 6000); 
        }

        function updateClock() {
            const now = new Date();
            const diff = now - startDate;
            const d = Math.floor(diff / (1000*60*60*24));
            const h = Math.floor((diff/(1000*60*60))%24);
            const m = Math.floor((diff/(1000*60))%60);
            const clockEl = document.getElementById('clock');
            if(clockEl) clockEl.innerText = `${d}d ${h}h ${m}m`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
